    <script type="text/javascript">
        window.addEventListener("hashchange", openCniBookmark);

        function openCniBookmark() {
            var hash = window.location.hash;

            if(hash.contains("cni")) {
                var splittedCniHash = hash.split("_");

                // example for CNCI: #cni_2905_51
                if (splittedCniHash.length > 2) {
                    var listId = splittedCniHash[2];
                    if (listId.toLowerCase() === 'null') {
                        listId = null;
                    }

                    window.cni.setItemForChildItem(splittedCniHash[1], null, listId, false, "");
                }
                // example: #cni_51, #cni
                else {
                    window.cni.open(splittedCniHash.length > 1 ? splittedCniHash[1] : null);
                }
                history.pushState("", document.title, window.location.pathname + window.location.search);
            }
        }
    </script>
